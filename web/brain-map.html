<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIB Brain Map</title><style>
*{box-sizing:border-box}body{margin:0;background:#071018;color:#e8f0f5;font:14px system-ui;overflow:hidden}header{height:58px;border-bottom:1px solid #203442;display:flex;align-items:center;padding:0 16px;gap:14px;background:#09151e}.brand{font-weight:800;letter-spacing:.08em}.brand b{color:#58d5ff}.search{margin-left:auto;width:min(420px,45vw);padding:9px 12px;background:#0c1922;border:1px solid #294453;border-radius:10px;color:#fff}.app{height:calc(100vh - 58px);display:grid;grid-template-columns:210px 1fr 300px}aside,.inspect{background:#0a151e;border-right:1px solid #203442;padding:12px;overflow:auto}.inspect{border:0;border-left:1px solid #203442}.nav{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;color:#b9c9d3;text-align:left}.nav:hover,.nav.on{background:#122532;color:#fff}.main{position:relative}.tools{height:48px;border-bottom:1px solid #203442;padding:7px;display:flex;gap:6px}.tool{background:#0c1922;color:#b8cad5;border:1px solid #203442;border-radius:7px;padding:7px 10px}.map{position:absolute;top:48px;bottom:0;left:0;right:0;background-image:linear-gradient(#58d5ff08 1px,transparent 1px),linear-gradient(90deg,#58d5ff08 1px,transparent 1px);background-size:40px 40px}.map canvas{width:100%;height:100%}.title{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#8da1af;margin:4px 0 12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:10px;border:1px solid #203442;border-radius:9px;background:#0c1922}.stat b{display:block;font-size:20px}.stat small{color:#8da1af}.card{margin-top:14px;padding:13px;border:1px solid #203442;border-radius:12px;background:#0c1922}.pill{display:inline-block;padding:3px 7px;border:1px solid #294453;border-radius:99px;color:#b8cbd6;font-size:10px;margin:2px}.kv{display:grid;grid-template-columns:75px 1fr;gap:7px;margin-top:10px;font-size:11px}.kv b{color:#8da1af}@media(max-width:900px){.app{grid-template-columns:170px 1fr}.inspect{display:none}}@media(max-width:600px){.app{grid-template-columns:1fr}.app aside{display:none}.search{width:48vw}}
</style></head><body>
<header><div class="brand">AIB <b>◆</b> BRAIN MAP</div><span style="color:#54e39a;font-size:11px">● VISUAL LAYER</span><input id="q" class="search" placeholder="Search the brain…"></header>
<div class="app"><aside><div class="title">Mind</div><button class="nav on" data-v="all">◈ Whole Brain</button><button class="nav" data-v="memory">● Memories</button><button class="nav" data-v="decision">◆ Decisions</button><button class="nav" data-v="goal">◎ Goals</button><button class="nav" data-v="task">◇ Tasks</button><button class="nav" data-v="event">◌ Events</button><div class="title" style="margin-top:18px">Data</div><button class="nav" id="load">⇧ Load Brain JSON</button><button class="nav" id="demo">✦ Demo Data</button><input id="file" type="file" accept=".json" hidden></aside>
<main class="main"><div class="tools"><button class="tool" id="zin">＋</button><button class="tool" id="zout">－</button><button class="tool" id="reset">Reset</button><button class="tool" id="layout">Re-layout</button><span id="mode" style="margin-left:auto;color:#8da1af;padding:8px;font-size:11px">WHOLE BRAIN</span></div><div class="map"><canvas id="c"></canvas></div></main>
<section class="inspect"><div class="title">Brain Inspector</div><div id="stats" class="stats"></div><div id="info" class="card" style="color:#8da1af">Select a node.</div></section></div>
<script>
const demo={projects:[{id:"p1",name:"Brain",status:"active"}],memories:[
{id:"m1",projectId:"p1",type:"fact",content:"Structured memories carry provenance, confidence and importance.",tags:["memory","architecture"],source:"domain/types.ts",confidence:1,importance:9,createdAt:"2026-10-05"},
{id:"m2",projectId:"p1",type:"rule",content:"High-impact actions stay behind approval boundaries.",tags:["security","policy"],source:"policy",confidence:1,importance:10,createdAt:"2026-10-05"},
{id:"m3",projectId:"p1",type:"lesson",content:"The visual layer observes the brain; it is not the authority.",tags:["visual","architecture"],source:"brain-map",confidence:.94,importance:8,createdAt:"2026-10-06"}],
decisions:[{id:"d1",projectId:"p1",text:"Keep personal and business brain contexts isolated.",rationale:"Prevent context bleed.",status:"active",createdAt:"2026-10-06"}],
goals:[{id:"g1",projectId:"p1",text:"Build a persistent AI brain that can remember and reason.",risk:"medium",createdAt:"2026-10-06"}],
tasks:[{id:"t1",projectId:"p1",title:"Build visual brain map",description:"Visualize memory and relationships.",status:"running",dependencies:[],risk:"low",createdAt:"2026-10-06"}],
events:[{id:"e1",projectId:"p1",type:"memory.created",actor:"memory-manager",timestamp:"2026-10-06",data:{memoryId:"m1"}}]};
let data=structuredClone(demo),view="all",nodes=[],links=[],sel=null,zoom=1,pan={x:0,y:0};
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function records(){return["memories","decisions","goals","tasks","events"].flatMap(k=>(data[k]||[]).map(x=>({...x,_type:k.slice(0,-1)})))}function title(n){return n._type==="memory"?n.content:n._type==="decision"?n.text:n._type==="goal"?n.text:n._type==="task"?n.title:n.type}
function rebuild(){let q=$("q").value.toLowerCase();nodes=records().filter(n=>(view==="all"||n._type===view)&&(!q||JSON.stringify(n).toLowerCase().includes(q)));let w=$("c").clientWidth,h=$("c").clientHeight;nodes.forEach((n,i)=>{let a=i/nodes.length*Math.PI*2,r=Math.min(w,h)*(.2+.05*(i%5));n.x=w/2+Math.cos(a)*r;n.y=h/2+Math.sin(a)*r});links=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){let a=nodes[i],b=nodes[j];if(a.projectId&&a.projectId===b.projectId)links.push([i,j])}draw();stats()}
function draw(){let c=$("c"),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);x.save();x.translate(pan.x,pan.y);x.scale(zoom,zoom);links.forEach(([i,j])=>{x.beginPath();x.moveTo(nodes[i].x,nodes[i].y);x.lineTo(nodes[j].x,nodes[j].y);x.strokeStyle="#5ca4c133";x.stroke()});nodes.forEach(n=>{let col={memory:"#58d5ff",decision:"#9d7cff",goal:"#54e39a",task:"#54e39a",event:"#ffcc66"}[n._type];x.beginPath();x.arc(n.x,n.y,34,0,Math.PI*2);x.fillStyle="#0d1b24";x.fill();x.lineWidth=n===sel?4:2;x.strokeStyle=col;x.stroke();x.fillStyle=col;x.font="9px system-ui";x.textAlign="center";x.fillText(n._type.toUpperCase(),n.x,n.y-5);x.fillStyle="#e8f0f5";x.font="10px system-ui";let t=title(n);if(t.length>22)t=t.slice(0,22)+"…";x.fillText(t,n.x,n.y+10)});x.restore()}
function stats(){$("stats").innerHTML=["memories","decisions","goals","tasks","events"].map(k=>'<div class="stat"><b>'+((data[k]||[]).length)+'</b><small>'+k+'</small></div>').join("")}
function inspect(n){sel=n;$("info").innerHTML='<b>'+esc(title(n))+'</b><div><span class="pill">'+n._type+'</span><span class="pill">'+esc(n.status||"record")+'</span></div><div class="kv"><b>ID</b><span>'+esc(n.id)+'</span>'+(n.source?'<b>Source</b><span>'+esc(n.source)+'</span>':"")+(n.confidence!=null?'<b>Confidence</b><span>'+Math.round(n.confidence*100)+'%</span>':"")+(n.importance!=null?'<b>Importance</b><span>'+n.importance+'</span>':"")+(n.rationale?'<b>Why</b><span>'+esc(n.rationale)+'</span>':"")+'</div>';draw()}
$("c").onclick=e=>{let r=$("c").getBoundingClientRect(),mx=(e.clientX-r.left-pan.x)/zoom,my=(e.clientY-r.top-pan.y)/zoom,n=nodes.find(n=>Math.hypot(mx-n.x,my-n.y)<38);if(n)inspect(n)}
$("q").oninput=rebuild;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.remove("on"));b.classList.add("on");view=b.dataset.v;$("mode").textContent=view.toUpperCase();rebuild()});
$("zin").onclick=()=>{zoom=Math.min(2.5,zoom+.15);draw()};$("zout").onclick=()=>{zoom=Math.max(.5,zoom-.15);draw()};$("reset").onclick=()=>{zoom=1;pan={x:0,y:0};rebuild()};$("layout").onclick=()=>{nodes.forEach(n=>{delete n.x;delete n.y});rebuild()};$("demo").onclick=()=>{data=structuredClone(demo);rebuild()};$("load").onclick=()=>$("file").click();$("file").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);rebuild()}catch(x){alert("Invalid Brain JSON")}};r.readAsText(f)};addEventListener("resize",rebuild);rebuild();
</script></body></html>
